[build-system]
requires = [
    "hatchling>=1.21",
]
build-backend = "hatchling.build"

[project]
name = "gemhub"
version = "1.0.9"
description = "Caching RubyGems mirror with a web hub: compact index, legacy index, verified gem files, and a package browser"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Hadi Cahyadi", email = "cumulus13@gmail.com" },
]
keywords = [
    "rubygems",
    "gem",
    "bundler",
    "mirror",
    "proxy",
    "cache",
    "registry",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Flask",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Software Distribution",
]
dependencies = [
    "psycopg[binary]>=3.1",
    "Flask>=3.0,<4",
    "Flask-SQLAlchemy>=3.1,<4",
    "SQLAlchemy>=2.0,<3",
    "requests>=2.31,<3",
    "redis>=5,<9",
    "waitress>=3,<4",
    "alembic>=1.13,<2",
    "PyYAML>=6,<7",
]

[project.license]
text = "MIT"

[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.1",
]
mysql = [
    "PyMySQL>=1.1",
]
dev = [
    "psycopg[binary]>=3.1",
    "pytest>=8",
    "ruff>=0.5",
]

[project.urls]
Homepage = "https://github.com/cumulus13/gemhub"
Issues = "https://github.com/cumulus13/gemhub/issues"

[project.scripts]
gemhub = "gemhub.cli:main"

[tool.hatch.build.targets.wheel]
packages = [
    "src/gemhub",
]

[tool.hatch.build.targets.sdist]
include = [
    "src",
    "tests",
    "README.md",
    "LICENSE",
    "Dockerfile",
    "docker-compose.yml",
]

[tool.pytest.ini_options]
testpaths = [
    "tests",
]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"
src = [
    "src",
    "tests",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "B",
    "UP",
    "C4",
    "SIM",
]
ignore = [
    "UP006",
    "UP007",
    "UP035",
    "UP045",
    "B008",
]
