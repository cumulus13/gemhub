name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest (26.04) no longer provides Python 3.9, so Linux is pinned.
        os: [ubuntu-24.04, windows-latest]
        python: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: pytest

  e2e-ruby:
    name: Real gem and Bundler clients
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - run: python -m pip install -e ".[dev]"
      - run: bash tests/e2e/build_fixture.sh "$RUNNER_TEMP/fixture"
      - run: python tests/e2e/run_ruby_e2e.py "$RUNNER_TEMP/fixture"
      - run: python tests/e2e/run_private_e2e.py "$RUNNER_TEMP/fixture"

  postgres:
    name: Tests on PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gemhub
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      GEMHUB_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/gemhub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[postgres,dev]"
      - run: pytest

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: gemhub:ci
      - name: Smoke test the image
        run: |
          docker run -d --name gemhub-ci -p 8080:8080 gemhub:ci
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8080/healthz && exit 0
            sleep 1
          done
          docker logs gemhub-ci
          exit 1
